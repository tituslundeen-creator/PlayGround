<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Collection — Pawcraft</title>
  <meta name="description" content="Meet the loyal companions in your pack and discover every dog's story, stats, and DNA.">
  <meta name="theme-color" content="#081712">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/labrador.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="paw-field"></span>
  </div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Pawcraft Dog Collection home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13.5c-3.6 0-6.5 2.4-6.5 5.2 0 1.7 1.4 2.8 3.1 2.6 1.2-.2 2.1-.8 3.4-.8s2.2.6 3.4.8c1.7.2 3.1-.9 3.1-2.6 0-2.8-2.9-5.2-6.5-5.2Z"/><ellipse cx="6.2" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="17.8" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="9.5" cy="5.2" rx="2.2" ry="2.9"/><ellipse cx="14.5" cy="5.2" rx="2.2" ry="2.9"/></svg>
        </span>
        <span class="brand-copy">
          <span class="brand-kicker">Pawcraft</span>
          <span class="brand-name">Dog Collection</span>
        </span>
      </a>

      <div class="topbar-count" aria-label="1 companion collected">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13.5c-3.6 0-6.5 2.4-6.5 5.2 0 1.7 1.4 2.8 3.1 2.6 1.2-.2 2.1-.8 3.4-.8s2.2.6 3.4.8c1.7.2 3.1-.9 3.1-2.6 0-2.8-2.9-5.2-6.5-5.2Z"/><ellipse cx="6.2" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="17.8" cy="9.4" rx="2.1" ry="2.7"/><ellipse cx="9.5" cy="5.2" rx="2.2" ry="2.9"/><ellipse cx="14.5" cy="5.2" rx="2.2" ry="2.9"/></svg>
        <span><strong id="collected-count">1</strong> collected</span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="site-footer">
      <span class="footer-brand">Pawcraft Kennel <span>•</span> Est. 2026</span>
      <span class="footer-note">Portrait of a Labrador by Dktue · CC0</span>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
